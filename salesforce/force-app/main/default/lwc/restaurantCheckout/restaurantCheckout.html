<template>
    <div class="card stack" role="form" aria-label="Checkout">
        <div class="spread">
            <h2 class="heading">Checkout</h2>
            <button type="button" class="btn-link" onclick={handleBack}>Back to cart</button>
        </div>

        <template lwc:if={error}><div class="alert alert-error" role="alert">{error}</div></template>

        <fieldset class="group stack">
            <legend>Your details</legend>
            <label class="field">
                <span>Name</span>
                <input name="customerName" type="text" maxlength="80" autocomplete="name" value={customerName} onchange={handleField} onkeydown={handleEnterKey} class={nameClass} aria-invalid={nameInvalid} />
                <template lwc:if={errors.customerName}><span class="err" role="alert">{errors.customerName}</span></template>
            </label>
            <label class="field">
                <span>Mobile number</span>
                <input name="customerPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="98765 43210" value={customerPhone} onchange={handleField} onkeydown={handleEnterKey} class={phoneClass} aria-invalid={phoneInvalid} />
                <template lwc:if={errors.customerPhone}><span class="err" role="alert">{errors.customerPhone}</span></template>
            </label>
            <label class="field">
                <span>Email (optional)</span>
                <input name="customerEmail" type="email" autocomplete="email" value={customerEmail} onchange={handleField} onkeydown={handleEnterKey} />
            </label>
        </fieldset>

        <fieldset class="group stack">
            <legend>Order type</legend>
            <div class="row">
                <template for:each={fulfilmentOptions} for:item="opt">
                    <label key={opt.value} class={opt.cssClass}>
                        <input type="radio" name="fulfilment" value={opt.value} checked={opt.checked} onchange={handleField} />
                        {opt.label}
                    </label>
                </template>
            </div>
            <template lwc:if={isDelivery}>
                <label class="field">
                    <span>Delivery address</span>
                    <input name="addressLine" type="text" maxlength="200" autocomplete="street-address" value={addressLine} onchange={handleField} onkeydown={handleEnterKey} class={addressClass} />
                    <template lwc:if={errors.addressLine}><span class="err" role="alert">{errors.addressLine}</span></template>
                </label>
                <div class="two">
                    <label class="field">
                        <span>Pincode</span>
                        <input name="pincode" type="text" inputmode="numeric" maxlength="6" autocomplete="postal-code" value={pincode} onchange={handleField} onkeydown={handleEnterKey} class={pincodeClass} />
                        <template lwc:if={errors.pincode}><span class="err" role="alert">{errors.pincode}</span></template>
                        <template lwc:if={pincodeOk}><span class="ok" role="status">✓ We deliver to this pincode</span></template>
                        <template lwc:if={pincodeBad}><span class="err" role="alert">We do not deliver to this pincode yet</span></template>
                    </label>
                    <label class="field">
                        <span>Landmark (optional)</span>
                        <input name="landmark" type="text" maxlength="100" value={landmark} onchange={handleField} onkeydown={handleEnterKey} />
                    </label>
                </div>
            </template>
        </fieldset>

        <fieldset class="group stack">
            <legend>Payment</legend>
            <div class="row">
                <template for:each={paymentOptions} for:item="opt">
                    <label key={opt.value} class={opt.cssClass}>
                        <input type="radio" name="paymentMethod" value={opt.value} checked={opt.checked} onchange={handleField} />
                        {opt.label}
                    </label>
                </template>
            </div>
            <template lwc:if={isOnline}>
                <p class="muted small">You will pay on the restaurant's secure payment page. We never see your card details.</p>
            </template>
            <label class="field">
                <span>Order notes (optional)</span>
            <textarea name="notes" rows="2" maxlength="300" onchange={handleField} onkeydown={handleEnterKey}>{notes}</textarea>
            </label>
        </fieldset>

        <div class="bill">
            <div class="bill-row"><span>Subtotal</span><span>{subtotalText}</span></div>
            <template lwc:if={showTax}><div class="bill-row"><span>Estimated tax</span><span>{taxText}</span></div></template>
            <template lwc:if={showDeliveryFee}><div class="bill-row"><span>Delivery fee</span><span>{deliveryFeeText}</span></div></template>
            <div class="bill-row bill-total"><span>Estimated total</span><span>{estimatedTotalText}</span></div>
        </div>
        <p class="muted small">The restaurant calculates the final total when the order is placed.</p>

        <button type="button" class="btn" data-id="submit" onclick={handleSubmit} disabled={submitting}>{submitLabel}</button>
    </div>
</template>
