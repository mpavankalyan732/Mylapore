# Render Blueprint: PostgreSQL + NestJS API + Next.js site.
# Secrets marked sync:false are entered in the Render dashboard (never committed).
databases:
  - name: mylapore-db
    plan: free
    databaseName: vegrestaurant
    user: mylapore

services:
  - type: web
    name: mylapore-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm run seed
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mylapore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STAFF_API_KEY
        generateValue: true
      - key: AGENT_API_KEY
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: SALESFORCE_INBOUND_KEY
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: COD_ENABLED
        value: "true"
      - key: TAX_PERCENT
        value: "0"
      - key: SERVICE_PINCODES
        value: 517501,517502,517503
      # Expected public URLs. If Render gives a service a different name/URL, update these (see DEPLOY.md).
      - key: FRONTEND_URL
        value: https://mylapore-web.onrender.com
      - key: CORS_ORIGINS
        value: https://mylapore-web.onrender.com
      - key: PUBLIC_ASSET_URL
        value: https://mylapore-web.onrender.com

  - type: web
    name: mylapore-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      # Expected public API URL. If Render gives the API a different URL, update these (see DEPLOY.md).
      - key: NEXT_PUBLIC_API_URL
        value: https://mylapore-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: https://mylapore-api.onrender.com
