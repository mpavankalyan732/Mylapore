<template>
    <section class="card stack" aria-label="Find your order">
        <div class="spread">
            <h2 class="heading">Track or cancel an order</h2>
            <button type="button" class="btn-link" onclick={handleBack}>Back to menu</button>
        </div>

        <div class="lookup" role="form" aria-label="Find your order">
            <label class="field">
                <span>Order number</span>
                <input name="orderNumber" type="text" maxlength="40" value={orderNumber} onchange={handleField} onkeydown={handleEnterKey} placeholder="e.g. VR261111-AB12CD" />
            </label>
            <label class="field">
                <span>Mobile number used for the order</span>
                <input name="phone" type="tel" inputmode="numeric" value={phone} onchange={handleField} onkeydown={handleEnterKey} placeholder="98765 43210" />
            </label>
            <button type="button" class="btn" data-id="submit" onclick={handleLookup} disabled={loading}>{lookupLabel}</button>
        </div>

        <template lwc:if={error}><div class="alert alert-error" role="alert">{error}</div></template>
        <template lwc:if={notice}><div class={noticeClass} role="status">{notice}</div></template>

        <template lwc:if={details}>
            <c-restaurant-order-details-view value={details}></c-restaurant-order-details-view>
            <template lwc:if={details.cancellable}>
                <button type="button" class="btn btn-danger" onclick={handleAskCancel} disabled={cancelling}>Cancel this order</button>
            </template>
        </template>
    </section>

    <template lwc:if={confirming}>
        <div class="backdrop" onclick={handleDismiss}>
            <section class="dialog stack" role="alertdialog" aria-modal="true" aria-labelledby="cancel-title" onclick={stop} onkeydown={handleKeydown}>
                <h3 id="cancel-title" class="heading">Cancel order {details.orderNumber}?</h3>
                <p>{confirmText}</p>
                <div class="row">
                    <button type="button" class="btn btn-outline" onclick={handleDismiss} data-focus>Keep my order</button>
                    <button type="button" class="btn btn-danger" onclick={handleConfirmCancel} disabled={cancelling}>{cancelLabel}</button>
                </div>
            </section>
        </div>
    </template>
</template>
