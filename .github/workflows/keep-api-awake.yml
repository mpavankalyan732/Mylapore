# Render's free web services sleep after ~15 minutes idle and take ~50s to wake.
# This pings the health endpoint every 10 minutes so the first customer is not the one who wakes it.
name: keep-api-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://mylapore-api.onrender.com/api/v1/health
