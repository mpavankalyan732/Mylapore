<template>
    <template lwc:if={failed}>
        <div class="alert alert-error" role="alert">{value.message}</div>
    </template>
    <template lwc:else>
        <div class="shell stack">
            <template lwc:if={info}><div class="alert alert-info" role="status">{info}</div></template>
            <template lwc:if={error}><div class="alert alert-error" role="alert">{error}</div></template>

            <!-- ============ MENU ============ -->
            <template lwc:if={isMenu}>
                <template lwc:if={hasWarnings}>
                    <div class="alert alert-info">
                        <template for:each={value.warnings} for:item="w"><p key={w}>{w}</p></template>
                    </div>
                </template>
                <div class="search">
                    <input type="search" class="search-input" placeholder={label.searchPlaceholder} aria-label={label.searchLabel} value={search} oninput={handleSearch} />
                </div>
                <template lwc:if={hasChips}>
                    <div class="chips" role="group" aria-label={label.categories}>
                        <template for:each={categoryChips} for:item="chip">
                            <button key={chip.key} type="button" class={chip.cssClass} data-key={chip.key} aria-pressed={chip.selected} onclick={handleChip}>{chip.name}</button>
                        </template>
                    </div>
                </template>
                <template lwc:if={isEmpty}><p class="muted">{label.noMatches}</p></template>
                <template for:each={groups} for:item="group">
                    <section key={group.key} class="stack">
                        <template lwc:if={group.title}>
                            <div class="spread">
                                <h3 class="group-title">{group.title}</h3>
                                <span class="muted small">{group.countText}</span>
                            </div>
                        </template>
                        <ul class="list">
                            <template for:each={group.items} for:item="item">
                                <li key={item.id} class="dish">
                                    <div class="photo">
                                        <template lwc:if={item.imageUrl}>
                                            <img class="photo-img" src={item.imageUrl} alt={item.name} loading="lazy" data-id={item.id} onerror={handleImageError} />
                                        </template>
                                        <template lwc:else><div class="photo-empty" aria-hidden="true">&#127859;</div></template>
                                    </div>
                                    <div class="dish-body">
                                        <div class="dish-name">
                                            <span class="veg" title={label.vegetarian} role="img" aria-label={label.vegetarian}></span>
                                            <span class="strong">{item.name}</span>
                                        </div>
                                        <template lwc:if={item.bestseller}><span class="badge badge-wait">{label.bestseller}</span></template>
                                        <div class="muted small clamp">{item.description}</div>
                                        <div class="dish-foot">
                                            <span class="price">{item.priceText}</span>
                                            <template lwc:if={item.unavailable}>
                                                <span class="badge badge-bad">{label.unavailable}</span>
                                                <button type="button" class="btn btn-outline" disabled>{label.add}</button>
                                            </template>
                                            <template lwc:else>
                                                <template lwc:if={item.inCart}>
                                                    <div class="stepper" role="group" aria-label={label.quantity}>
                                                        <button type="button" class="step-btn" data-id={item.id} aria-label={item.decAria} onclick={handleDec}>&minus;</button>
                                                        <span class="qty" aria-live="polite">{item.quantity}</span>
                                                        <button type="button" class="step-btn" data-id={item.id} aria-label={item.incAria} onclick={handleAdd} disabled={item.atMax}>+</button>
                                                    </div>
                                                </template>
                                                <template lwc:else>
                                                    <button type="button" class="btn btn-outline" data-id={item.id} aria-label={item.addAria} onclick={handleAdd}>{label.add}</button>
                                                </template>
                                            </template>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                        <template lwc:if={group.moreText}><p class="muted small">{group.moreText}</p></template>
                    </section>
                </template>
                <template lwc:if={hasCart}>
                    <div class="bar">
                        <button type="button" class="btn bar-btn" onclick={goCart}>{cartBarText}</button>
                        <span class="muted small">{label.cartBarNote}</span>
                    </div>
                </template>
            </template>

            <!-- ============ CART ============ -->
            <template lwc:if={isCart}>
                <section class="panel stack">
                    <h3 class="group-title">{label.cartTitle}</h3>
                    <template lwc:if={cartEmpty}><p class="muted">{label.cartEmpty}</p></template>
                    <ul class="list">
                        <template for:each={cartLines} for:item="line">
                            <li key={line.id} class="dish dish-cart">
                                <template lwc:if={line.imageUrl}>
                                    <img class="cart-photo" src={line.imageUrl} alt={line.name} data-id={line.id} onerror={handleImageError} />
                                </template>
                                <div class="dish-body">
                                    <div class="spread">
                                        <span class="strong">{line.name}</span>
                                        <span class="price">{line.totalText}</span>
                                    </div>
                                    <div class="muted small">{line.unitText}</div>
                                    <input type="text" class="note" maxlength="200" data-id={line.id} value={line.notes}
                                        placeholder={label.notesPlaceholder} aria-label={label.notesLabel} onchange={handleNote} />
                                    <div class="spread">
                                        <div class="stepper" role="group" aria-label={label.quantity}>
                                            <button type="button" class="step-btn" data-id={line.id} aria-label={line.decAria} onclick={handleDec}>&minus;</button>
                                            <span class="qty" aria-live="polite">{line.quantity}</span>
                                            <button type="button" class="step-btn" data-id={line.id} aria-label={line.incAria} onclick={handleAdd} disabled={line.atMax}>+</button>
                                        </div>
                                        <button type="button" class="btn-link" data-id={line.id} aria-label={line.removeAria} onclick={handleRemove}>{label.remove}</button>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                    <div class="bill"><div class="bill-row bill-total"><span>{label.cartEstimate}</span><span>{subtotalText}</span></div></div>
                    <p class="muted small">{label.cartEstimateNote}</p>
                    <div class="row cta">
                        <button type="button" class="btn grow" onclick={goDetails} disabled={cartEmpty}>{label.continue}</button>
                        <button type="button" class="btn btn-outline" onclick={goMenu}>{label.addMore}</button>
                    </div>
                    <button type="button" class="btn-link" onclick={handleClearCart}>{label.clearCart}</button>
                </section>
            </template>

            <!-- ============ DETAILS ============ -->
            <template lwc:if={isDetails}>
                <div class="panel stack" role="form" aria-label={label.detailsTitle}>
                    <h3 class="group-title">{label.detailsTitle}</h3>
                    <label class="field">{label.name}
                        <input class={nameClass} type="text" name="customerName" value={customerName} onchange={handleField} onkeydown={handleReviewKeydown}
                            autocomplete="name" aria-invalid={nameInvalid} />
                        <template lwc:if={errors.customerName}><span class="err" role="alert">{errors.customerName}</span></template>
                    </label>
                    <label class="field">{label.mobile}
                        <input class={phoneClass} type="tel" inputmode="numeric" name="customerPhone" value={customerPhone} onchange={handleField} onkeydown={handleReviewKeydown}
                            autocomplete="tel" aria-invalid={phoneInvalid} />
                        <template lwc:if={errors.customerPhone}><span class="err" role="alert">{errors.customerPhone}</span></template>
                    </label>
                    <fieldset class="field">
                        <legend>{label.orderType}</legend>
                        <template for:each={fulfilmentOptions} for:item="o">
                            <label key={o.value} class={o.cssClass}>
                                <input type="radio" name="fulfilment" value={o.value} checked={o.checked} onchange={handleField} /> {o.label}
                            </label>
                        </template>
                    </fieldset>
                    <template lwc:if={isDelivery}>
                        <label class="field">{label.address}
                            <input class={addressClass} type="text" name="addressLine" value={addressLine} onchange={handleField} onkeydown={handleReviewKeydown}
                                autocomplete="street-address" aria-invalid={addressInvalid} />
                            <template lwc:if={errors.addressLine}><span class="err" role="alert">{errors.addressLine}</span></template>
                        </label>
                        <label class="field">{label.pincode}
                            <input class={pincodeClass} type="text" inputmode="numeric" name="pincode" value={pincode} onchange={handleField} onkeydown={handleReviewKeydown}
                                autocomplete="postal-code" aria-invalid={pincodeInvalid} />
                            <template lwc:if={errors.pincode}><span class="err" role="alert">{errors.pincode}</span></template>
                        </label>
                    </template>
                    <template lwc:if={showPaymentChoice}>
                        <fieldset class="field">
                            <legend>{label.payHow}</legend>
                            <template for:each={paymentOptions} for:item="o">
                                <label key={o.value} class={o.cssClass}>
                                    <input type="radio" name="paymentMethod" value={o.value} checked={o.checked} onchange={handleField} /> {o.label}
                                </label>
                            </template>
                        </fieldset>
                    </template>
                    <div class="row cta">
                        <button type="button" data-action="review" class="btn grow" onclick={handleReview} disabled={submitting}>{reviewLabel}</button>
                        <button type="button" class="btn btn-outline" onclick={handleBackToCart} disabled={submitting}>{label.back}</button>
                    </div>
                </div>
            </template>

            <!-- ============ PAYMENT ============ -->
            <template lwc:if={isPayment}>
                <section class="panel stack">
                    <div class="spread">
                        <h3 class="group-title">{orderTitle}</h3>
                        <span class="badge badge-wait">{label.waitingCard}</span>
                    </div>
                    <template lwc:if={hasOrderLines}>
                        <ul class="list">
                            <template for:each={orderLines} for:item="l">
                                <li key={l.key} class="spread"><span>{l.text}</span><span class="price">{l.totalText}</span></li>
                            </template>
                        </ul>
                    </template>
                    <div class="bill">
                        <div class="bill-row"><span>{label.subtotal}</span><span>{orderSubtotalText}</span></div>
                        <template lwc:if={showOrderTax}><div class="bill-row"><span>{label.tax}</span><span>{orderTaxText}</span></div></template>
                        <template lwc:if={showOrderFee}><div class="bill-row"><span>{label.deliveryFee}</span><span>{orderFeeText}</span></div></template>
                        <div class="bill-row bill-total"><span>{label.amountToPay}</span><span>{orderTotalText}</span></div>
                    </div>

                    <template lwc:if={chooseMethod}>
                        <h4 class="sub">{label.reviewTitle}</h4>
                        <div class="pay-options">
                            <button type="button" class="pay-option" onclick={handlePayCard} disabled={starting}>
                                <span class="strong">{label.payCard}</span><span class="muted small">{label.payCardHint}</span>
                            </button>
                            <button type="button" class="pay-option" onclick={handlePayUpi} disabled={starting}>
                                <span class="strong">{label.payUpi}</span><span class="muted small">{label.payUpiHint}</span>
                            </button>
                        </div>
                    </template>

                    <template lwc:if={isCardWait}>
                        <div class="wait" role="status" aria-live="polite">
                            <span class="spinner" aria-hidden="true"></span>
                            <div><div class="strong">{label.waitingCard}</div><div class="muted small">{label.waitingCardHint}</div></div>
                        </div>
                        <template lwc:if={paymentUrl}>
                            <a class="btn" href={paymentUrl} target="_blank" rel="noopener noreferrer">{label.openPayment}</a>
                        </template>
                    </template>

                    <template lwc:if={isQrWait}>
                        <div class="qr-box" role="status" aria-live="polite">
                            <div class="strong">{label.scanTitle}</div>
                            <template lwc:if={qrImageUrl}><img class="qr" src={qrImageUrl} alt={qrAlt} /></template>
                            <div class="price">{scanAmountText}</div>
                            <div class="muted small">{countdownText}</div>
                            <div class="muted small"><span class="spinner" aria-hidden="true"></span> {label.waitingUpi}</div>
                        </div>
                    </template>

                    <div class="row cta">
                        <template lwc:if={payMode}>
                            <button type="button" class="btn btn-outline grow" onclick={handleChangeMethod}>{label.changeMethod}</button>
                        </template>
                        <button type="button" class="btn btn-outline" onclick={handleCancelOrder} disabled={cancelling}>{label.cancelOrder}</button>
                    </div>
                </section>
            </template>

            <!-- ============ FAILED / EXPIRED ============ -->
            <template lwc:if={isRetry}>
                <section class="panel stack">
                    <div class="alert alert-error" role="alert"><span class="strong">{retryTitle}</span><p>{retryBody}</p></div>
                    <div class="spread"><span class="strong">{orderTitle}</span><span>{orderTotalText}</span></div>
                    <div class="row cta">
                        <button type="button" class="btn grow" onclick={handleTryAgain} disabled={starting}>{label.tryAgain}</button>
                        <button type="button" class="btn btn-outline" onclick={handleCancelOrder} disabled={cancelling}>{label.cancelOrder}</button>
                    </div>
                </section>
            </template>

            <!-- ============ SUCCESS ============ -->
            <template lwc:if={isSuccess}>
                <section class="panel stack">
                    <template lwc:if={showCancelled}>
                        <div class="alert alert-error" role="status"><span class="strong">{label.cancelledTitle}</span><p>{cancelledBody}</p></div>
                    </template>
                    <template lwc:if={showPaidSuccess}>
                        <div class="success" role="status">
                            <span class="tick" aria-hidden="true">&#10003;</span>
                            <div><div class="strong">{label.successTitle}</div><div class="small">{label.successPaid}</div></div>
                        </div>
                    </template>
                    <template lwc:if={showCounterSuccess}>
                        <div class="success" role="status">
                            <span class="tick" aria-hidden="true">&#10003;</span>
                            <div><div class="strong">{label.successTitle}</div><div class="small">{label.successCounter}</div></div>
                        </div>
                    </template>
                    <div class="spread"><span class="strong">{orderTitle}</span></div>
                    <template lwc:if={hasOrderLines}>
                        <ul class="list">
                            <template for:each={orderLines} for:item="l">
                                <li key={l.key} class="spread"><span>{l.text}</span><span class="price">{l.totalText}</span></li>
                            </template>
                        </ul>
                    </template>
                    <div class="bill"><div class="bill-row bill-total"><span>{totalLabel}</span><span>{orderTotalText}</span></div></div>
                    <template lwc:if={trackUrl}>
                        <a class="btn-link" href={trackUrl} target="_blank" rel="noopener noreferrer">{label.track}</a>
                    </template>
                    <button type="button" class="btn btn-outline" onclick={handleOrderMore}>{label.orderMore}</button>
                </section>
            </template>
        </div>
    </template>
</template>
