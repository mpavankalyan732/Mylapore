# Render Blueprint: PostgreSQL + NestJS API + Next.js site.
# Secrets marked sync:false are entered in the Render dashboard (never committed).
# Database: Mylapore uses its own "mylapore" schema inside the existing busyatra-db
# instance (Render allows one free Postgres per workspace).

services:
  - type: web
    name: mylapore-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: export DATABASE_URL="${DATABASE_URL}?schema=mylapore" && npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm run seed
    startCommand: DATABASE_URL="${DATABASE_URL}?schema=mylapore" node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: busyatra-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STAFF_API_KEY
        generateValue: true
      - key: AGENT_API_KEY
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: SALESFORCE_INBOUND_KEY
        generateValue: true
      # Razorpay TEST-mode keys: enter the values in the Render dashboard, never commit them.
      # Google sign-in: the OAuth client ID (public). Chat identity: RS256 private key, dashboard only, never committed.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CHAT_JWT_PRIVATE_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: TRUSTED_CHECKOUT_HOSTS
        value: rzp.io,razorpay.com
      - key: COD_ENABLED
        value: "true"
      - key: TAX_PERCENT
        value: "0"
      - key: SERVICE_PINCODES
        value: 517501,517502,517503
      # Expected public URLs. If Render gives a service a different name/URL, update these (see DEPLOY.md).
      - key: FRONTEND_URL
        value: https://mylapore-web.onrender.com
      - key: CORS_ORIGINS
        value: https://mylapore-web.onrender.com
      - key: PUBLIC_ASSET_URL
        value: https://mylapore-web.onrender.com

  - type: web
    name: mylapore-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      # Expected public API URL. If Render gives the API a different URL, update these (see DEPLOY.md).
      - key: NEXT_PUBLIC_API_URL
        value: https://mylapore-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: https://mylapore-api.onrender.com
